<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pocopoco works</title>
<meta name="description" content="pocopoco works の公式サイト。かわいくて気持ちいいスマホアプリを作っています。">
<style>
  :root { --text: #fff; --accent: #FFD23F; }
  html { background: #6A5ACD; }
  body { margin: 0; min-height: 100vh; background: linear-gradient(#2B1055, #6A5ACD); color: var(--text);
         font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif; line-height: 1.8; }
  main { max-width: 720px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { font-size: 2rem; margin: 0; letter-spacing: 0.02em; }
  h1 span { color: var(--accent); }
  .lead { opacity: 0.85; margin: 4px 0 32px; }
  h2 { font-size: 1.1rem; color: var(--accent); margin: 32px 0 12px; }
  .app { display: flex; gap: 16px; align-items: center; background: rgba(255,255,255,0.1);
         border: 1px solid rgba(255,255,255,0.2); border-radius: 16px; padding: 16px; }
  .app img { width: 80px; height: 80px; border-radius: 18px; flex: none; }
  .app h3 { margin: 0; font-size: 1.15rem; }
  .app p { margin: 2px 0 6px; opacity: 0.9; font-size: 0.95rem; }
  .app a { color: var(--accent); font-size: 0.9rem; margin-right: 12px; }
  footer { margin-top: 48px; opacity: 0.75; font-size: 0.9rem; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>pocopoco <span>works</span></h1>
  <p class="lead">かわいくて、さわって気持ちいいスマホアプリを作っています。</p>

  <h2>アプリ</h2>
  <div class="app">
    <img src="mochipop/icon.png" alt="もちポップのアイコン">
    <div>
      <h3>もちポップ</h3>
      <p>同じ色のもちをタップしてポップ！1回60秒の連鎖パズル。</p>
      <a href="mochipop/support.html">サポート</a>
      <a href="mochipop/privacy.html">プライバシーポリシー</a>
    </div>
  </div>

  <footer>
    お問い合わせ：<a href="mailto:pocopoco.works@gmail.com">pocopoco.works@gmail.com</a>
  </footer>
</main>
</body>
</html>
